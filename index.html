<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js"></script>
  <title>Frontend Mentor | Password generator app</title>
</head>
<body>
  <main>
    <header>Password Generator</header>
    <section class="body">
     <div class="password-code">P4$5W0rD!</div>
     <img src="./starter-code/assets/images/icon-copy.svg" alt="icon-copy">
    </section>
    <section class="character-length">
      <section class="zero-container">
        <h1>Character Length</h1>
        <p class="zero">0</p>
      </section>

      <div class="slider-bar">
        <input type="range" name="character-length" id="character-length" min="0" max="20" value="0" step="10">
      </div>

      <ul class="password-character">
        <li>
          <input type="checkbox" name="uppercase-letter" id="uppercase-letter">
          <label for="uppercase-letter">Include Uppercase Letters</label>
        </li>
        <li>
          <input type="checkbox" name="lowercase-letter" id="lowercase-letter">
          <label for="uppercase-letter">Include Lowercase Letters</label>
        </li>
        <li>
          <input type="checkbox" name="numbers" id="numbers">
          <label for="uppercase-letter">Include Numbers</label>
        </li>
        <li>
          <input type="checkbox" name="symbols" id="symbols">
          <label for="uppercase-letter">Include Symbols</label>
        </li>
      </ul>
    
    <section class="strength">
      <div class="strength-label">STRENGTH</div>
      <section class="meter-divs">
        <p class="medium">MEDIUM</p>
        <div class="meter-1"></div>
        <div class="meter-2"></div>
        <div class="meter-3"></div>
        <div class="meter-4"></div>

      </section>

    </section>

    <section class="generate-section">
      <button class="generate-btn">Generate
        <img src="./starter-code/assets/images/icon-arrow-right.svg" alt="icon-arrow-right">
      </button>
    </section>

    </section>
  



  </main>

</body>
</html>
